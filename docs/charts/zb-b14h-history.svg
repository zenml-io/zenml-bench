<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 363" width="920" height="363" role="img" aria-label="B14H: re-processed days, and the rule &quot;the latest completed processing counts&quot;">
<title>B14H: re-processed days, and the rule &quot;the latest completed processing counts&quot;</title>
<style>
svg { --paper:#f3f5f2; --surface:#fbfcfa; --ink:#1b2422; --muted:#56635e; --rule:#d5ddd8; --accent:#17667a;
  --accent-soft:#dcebee; --ok:#a9cdb3; --fail:#c2412d; --warn:#d9a13a; --stale:#b7c0bc; --partial:#e08a6a;
  --commit:#2c4a52; --commit-ink:#f3f5f2; --fail-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --paper:#111816; --surface:#18201e; --ink:#e3ebe7; --muted:#9aaaa4; --rule:#2c3835; --accent:#6cc0d4;
    --accent-soft:#1c3339; --ok:#3f7a55; --fail:#e0634e; --warn:#d9a54a; --stale:#56625e; --partial:#e59a7c;
    --commit:#a9ccd4; --commit-ink:#111816; --fail-ink:#111816; }
}
text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.bg { fill: var(--surface); stroke: var(--rule); }
.title { font-size: 15px; font-weight: 600; }
.axis { font-size: 11px; fill: var(--muted); }
.row-label { font-size: 12px; }
.bar-label { font-size: 11.5px; }
.note { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12px; fill: var(--muted); }
.gridline { stroke: var(--rule); stroke-width: 1; }
.k-problem { fill: var(--fail); } .k-decoy { fill: var(--warn); } .k-partial { fill: var(--partial); }
.k-neutral { fill: var(--stale); } .k-ok { fill: var(--ok); } .k-fail { fill: var(--fail); }
.k-cached { fill: var(--stale); } .k-plain { fill: var(--paper); stroke: var(--rule); } .k-commit { fill: var(--commit); } .k-accent { fill: var(--accent); }
.ring { fill: none; stroke: var(--accent); stroke-width: 3; }
.box { fill: var(--paper); stroke: var(--rule); }
.box-hot { fill: var(--paper); stroke: var(--fail); stroke-width: 2; }
.box-good { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.box-name { font-size: 12.5px; font-weight: 600; fill: var(--accent); }
.box-text { font-size: 11.5px; fill: var(--muted); }
.arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
.commit-label { font-size: 10px; font-weight: 600; fill: var(--commit-ink); }
.cell-text { font-size: 11px; font-weight: 600; fill: var(--ink); }
.cell-text-inv { font-size: 11px; font-weight: 600; fill: var(--fail-ink); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a9893"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="362" rx="10"/>
<text class="title" x="20" y="28">B14H: re-processed days, and the rule &quot;the latest completed processing counts&quot;</text>
<text class="axis mono" x="230.8" y="58.0" text-anchor="middle">08-24</text>
<text class="axis mono" x="352.5" y="58.0" text-anchor="middle">08-25</text>
<text class="axis mono" x="474.2" y="58.0" text-anchor="middle">08-26</text>
<text class="axis mono" x="595.8" y="58.0" text-anchor="middle">08-27</text>
<text class="axis mono" x="717.5" y="58.0" text-anchor="middle">08-28</text>
<text class="axis mono" x="839.2" y="58.0" text-anchor="middle">09-08</text>
<text class="row-label" x="158.0" y="92.0" text-anchor="end">first processing</text>
<rect class="k-ok" x="175.0" y="74.0" width="111.7" height="28" rx="5"/>
<text class="cell-text" x="230.8" y="92.0" text-anchor="middle">ok</text>
<rect class="k-ok" x="296.7" y="74.0" width="111.7" height="28" rx="5"/>
<text class="cell-text" x="352.5" y="92.0" text-anchor="middle">ok</text>
<text class="note" x="352.5" y="117.0" text-anchor="middle">still counts: its v2</text>
<text class="note" x="352.5" y="130.0" text-anchor="middle">failed</text>
<rect class="k-fail" x="418.3" y="74.0" width="111.7" height="28" rx="5"/>
<text class="cell-text-inv" x="474.2" y="92.0" text-anchor="middle">failed</text>
<text class="note" x="474.2" y="117.0" text-anchor="middle">largest summary of</text>
<text class="note" x="474.2" y="130.0" text-anchor="middle">all</text>
<rect class="k-ok" x="540.0" y="74.0" width="111.7" height="28" rx="5"/>
<text class="cell-text" x="595.8" y="92.0" text-anchor="middle">ok</text>
<text class="note" x="595.8" y="117.0" text-anchor="middle">superseded by its v2</text>
<rect class="k-fail" x="661.7" y="74.0" width="111.7" height="28" rx="5"/>
<text class="cell-text-inv" x="717.5" y="92.0" text-anchor="middle">failed</text>
<text class="note" x="717.5" y="117.0" text-anchor="middle">no export</text>
<text class="row-label" x="158.0" y="162.0" text-anchor="end">re-processed (v2)</text>
<rect class="k-fail" x="296.7" y="144.0" width="111.7" height="28" rx="5"/>
<text class="cell-text-inv" x="352.5" y="162.0" text-anchor="middle">failed</text>
<text class="note" x="352.5" y="187.0" text-anchor="middle">latest, but failed</text>
<rect class="k-ok" x="418.3" y="144.0" width="111.7" height="28" rx="5"/>
<rect class="ring" x="415.3" y="141.0" width="117.7" height="34" rx="7"/>
<text class="cell-text" x="474.2" y="162.0" text-anchor="middle">ok</text>
<text class="note" x="474.2" y="187.0" text-anchor="middle">the answer: summarise</text>
<text class="note" x="474.2" y="200.0" text-anchor="middle">output version 5</text>
<rect class="k-ok" x="540.0" y="144.0" width="111.7" height="28" rx="5"/>
<text class="cell-text" x="595.8" y="162.0" text-anchor="middle">ok</text>
<text class="note" x="595.8" y="187.0" text-anchor="middle">counts for 08-27</text>
<text class="row-label" x="158.0" y="232.0" text-anchor="end">scheduled</text>
<rect class="k-ok" x="783.3" y="214.0" width="111.7" height="28" rx="5"/>
<text class="cell-text" x="839.2" y="232.0" text-anchor="middle">ok</text>
<text class="note" x="839.2" y="257.0" text-anchor="middle">largest completed</text>
<text class="note" x="839.2" y="270.0" text-anchor="middle">run, but not a</text>
<text class="note" x="839.2" y="283.0" text-anchor="middle">backfill</text>
<text class="note" x="20" y="311.0">Each simpler rule lands on a different run: largest summary (08-26 first), largest completed (08-27 first), latest processing (08-25 v2), any run (09-08).</text>
<rect class="k-ok" x="20.0" y="335.0" width="14" height="14" rx="3"/>
<text class="legend" x="40.0" y="347.0">completed</text>
<rect class="k-fail" x="117.80000000000001" y="335.0" width="14" height="14" rx="3"/>
<text class="legend" x="137.8" y="347.0">failed</text>
<rect class="ring" x="195.14000000000001" y="336.5" width="11" height="11" rx="2"/>
<text class="legend" x="213.64000000000001" y="347.0">what the grader checks</text>
</svg>
