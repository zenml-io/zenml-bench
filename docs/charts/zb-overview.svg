<rect class="pill" x="575.2" y="180.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="580.2" y="192.5" font-size="9.5">b1-source-root-repair</text>
<text class="note" x="577.2" y="236.0">Promote stages safely,</text>
<text class="note" x="577.2" y="249.0">configure K8s pods,</text>
<text class="note" x="577.2" y="262.0">register stacks, fix .zen</text>
<text class="note" x="577.2" y="275.0">roots.</text>
<rect class="box" x="749.6" y="70.0" width="170.4" height="226.0" rx="8"/>
<text class="box-name" x="759.6" y="90.0">Research loops</text>
<text class="axis" x="759.6" y="104.0">5 tasks</text>
<rect class="pill" x="757.6" y="114.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="762.6" y="126.5" font-size="9.5">r1-improve-within-budget</text>
<rect class="pill" x="757.6" y="136.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="762.6" y="148.5" font-size="9.5">r2-screen-then-confirm</text>
<rect class="pill" x="757.6" y="158.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="762.6" y="170.5" font-size="9.5">r1-clock</text>
<rect class="pill" x="757.6" y="180.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="762.6" y="192.5" font-size="9.5">r1-bare</text>
<rect class="pill" x="757.6" y="202.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="762.6" y="214.5" font-size="9.5">r1-bare-clock</text>
<text class="note" x="759.6" y="236.0">Iterative ML under a</text>
<text class="note" x="759.6" y="249.0">12-run or 25-min budget,</text>
<text class="note" x="759.6" y="262.0">plus no-framework twins.</text>
<rect class="box-soft" x="20" y="312.0" width="540.0" height="62" rx="8"/>
<text class="box-name" x="32" y="332.0">Three evaluation conditions (same tasks, same graders)</text>
<text class="box-text" x="32" y="350.0">bare: container + offline docs  ·  skill: + pinned ZenML skills  ·  mcp: + ZenML MCP server</text>
<text class="note" x="32" y="365.0">Lets you measure whether docs, skills, or MCP tools actually move pass rates.</text>
<rect class="box" x="574.0" y="312.0" width="346.0" height="62" rx="8"/>
<text class="box-name" x="586.0" y="332.0">Generated families (for RL training)</text>
<text class="box-text" x="586.0" y="350.0">b10 &amp; b3 generators vary faults, names &amp; data</text>
<text class="note" x="586.0" y="365.0">Seeds 0–4 committed as held-out; 1000+ for training.</text>
</svg>
