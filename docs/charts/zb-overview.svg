<text class="box-name" x="212.4" y="90.0">Caching</text>
<text class="axis" x="212.4" y="104.0">2 tasks</text>
<rect class="pill" x="210.4" y="114.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="215.4" y="126.5" font-size="9.5">b3-stale-cache</text>
<rect class="pill" x="210.4" y="136.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="215.4" y="148.5" font-size="9.5">b4-nondeterministic-step</text>
<text class="note" x="212.4" y="236.0">Invalidate on file contents</text>
<text class="note" x="212.4" y="249.0">(not path strings) and keep</text>
<text class="note" x="212.4" y="262.0">random steps fresh.</text>
<rect class="box" x="384.8" y="70.0" width="170.4" height="226.0" rx="8"/>
<text class="box-name" x="394.8" y="90.0">History &amp; lineage</text>
<text class="axis" x="394.8" y="104.0">4 tasks</text>
<rect class="pill" x="392.8" y="114.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="397.8" y="126.5" font-size="9.5">b10-why-did-it-fail</text>
<rect class="pill-hot" x="392.8" y="136.0" width="154.4" height="18" rx="4"/>
<text class="pill-hot-text mono" x="397.8" y="148.5" font-size="9.5">b10h (hard)</text>
<rect class="pill" x="392.8" y="158.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="397.8" y="170.5" font-size="9.5">b14-artifact-retrieval</text>
<rect class="pill-hot" x="392.8" y="180.0" width="154.4" height="18" rx="4"/>
<text class="pill-hot-text mono" x="397.8" y="192.5" font-size="9.5">b14h (hard)</text>
<text class="note" x="394.8" y="236.0">Diagnose real failures past</text>
<text class="note" x="394.8" y="249.0">decoys; trace lineage with</text>
<text class="note" x="394.8" y="262.0">supersession rules.</text>
<rect class="box" x="567.2" y="70.0" width="170.4" height="226.0" rx="8"/>
<text class="box-name" x="577.2" y="90.0">Models &amp; config</text>
<text class="axis" x="577.2" y="104.0">4 tasks</text>
<rect class="pill" x="575.2" y="114.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="580.2" y="126.5" font-size="9.5">b6-model-promotion</text>
<rect class="pill" x="575.2" y="136.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="580.2" y="148.5" font-size="9.5">b7-kubernetes-settings</text>
