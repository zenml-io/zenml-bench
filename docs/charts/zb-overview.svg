<text class="axis" x="30.0" y="104.0">3 tasks</text>
<rect class="pill" x="28.0" y="114.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="33.0" y="126.5" font-size="9.5">b2-script-to-pipeline</text>
<rect class="pill" x="28.0" y="136.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="33.0" y="148.5" font-size="9.5">b9-modernise-old-api</text>
<rect class="pill" x="28.0" y="158.0" width="154.4" height="18" rx="4"/>
<text class="pill-text mono" x="33.0" y="170.5" font-size="9.5">b5-custom-materializer</text>
<text class="note" x="30.0" y="236.0">Turn scripts into typed</text>
<text class="note" x="30.0" y="249.0">pipelines, upgrade 0.4x</text>
<text class="note" x="30.0" y="262.0">APIs, write materializers.</text>
