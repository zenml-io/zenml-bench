<rect class="k-fail" x="224.04" y="451.0" width="13" height="13" rx="3"/>
<text class="legend" x="243.04" y="462.0">wrong (should be cached)</text>
<rect class="ring" x="406.67999999999995" y="451.5" width="11" height="11" rx="2"/>
<text class="legend" x="424.17999999999995" y="462.0">what the grader checks</text>
