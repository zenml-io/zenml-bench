<rect class="k-ok" x="171.5" y="200.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="240.5" y="218.0" text-anchor="middle">ran</text>
<rect class="k-cached" x="322.5" y="200.0" width="138.0" height="28" rx="5"/>
<rect class="ring" x="319.5" y="197.0" width="144.0" height="34" rx="7"/>
<text class="cell-text" x="391.5" y="218.0" text-anchor="middle">cached</text>
<rect class="k-ok" x="473.5" y="200.0" width="138.0" height="28" rx="5"/>
<rect class="ring" x="470.5" y="197.0" width="144.0" height="34" rx="7"/>
<text class="cell-text" x="542.5" y="218.0" text-anchor="middle">ran</text>
<rect class="k-cached" x="624.5" y="200.0" width="138.0" height="28" rx="5"/>
<rect class="ring" x="621.5" y="197.0" width="144.0" height="34" rx="7"/>
<text class="cell-text" x="693.5" y="218.0" text-anchor="middle">cached</text>
<rect class="k-ok" x="775.5" y="200.0" width="138.0" height="28" rx="5"/>
<rect class="ring" x="772.5" y="197.0" width="144.0" height="34" rx="7"/>
<text class="cell-text" x="844.5" y="218.0" text-anchor="middle">ran</text>
<text class="row-label" x="165.0" y="245.0" font-weight="600">Scores match every fixture; train is cached iff data is unchanged -&gt; reward 1</text>
<text class="section-head" x="20" y="282.0">The obvious fix: enable_cache=False on load_data</text>
<text class="row-label" x="153.0" y="312.0" text-anchor="end">load_data</text>
<rect class="k-ok" x="171.5" y="294.0" width="138.0" height="28" rx="5"/>
