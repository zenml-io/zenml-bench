<text class="row-label" x="170.0" y="402.0" font-weight="600">Scores are right, but train reruns every time: reward 0</text>
<text class="note" x="20" y="436.0">A freshly loaded DataFrame is a new artifact with a new id, and the pandas materializer has no content hash, so train&#x27;s cache key changes even when the data is</text>
<text class="note" x="20" y="450.0">identical.</text>
