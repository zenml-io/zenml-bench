<rect class="k-ok" x="473.5" y="294.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="542.5" y="312.0" text-anchor="middle">ran</text>
<rect class="k-ok" x="624.5" y="294.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="693.5" y="312.0" text-anchor="middle">ran</text>
<rect class="k-ok" x="775.5" y="294.0" width="138.0" height="28" rx="5"/>
