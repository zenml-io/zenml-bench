<text class="row-label" x="153.0" y="354.0" text-anchor="end">train (3s)</text>
<rect class="k-ok" x="171.5" y="336.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="240.5" y="354.0" text-anchor="middle">ran</text>
<rect class="k-fail" x="322.5" y="336.0" width="138.0" height="28" rx="5"/>
<text class="cell-text-inv" x="391.5" y="354.0" text-anchor="middle">ran</text>
<text class="note" x="391.5" y="378.0" text-anchor="middle">new artifact id -&gt; miss</text>
<rect class="k-ok" x="473.5" y="336.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="542.5" y="354.0" text-anchor="middle">ran</text>
<rect class="k-fail" x="624.5" y="336.0" width="138.0" height="28" rx="5"/>
<text class="cell-text-inv" x="693.5" y="354.0" text-anchor="middle">ran</text>
<text class="note" x="693.5" y="378.0" text-anchor="middle">new artifact id -&gt; miss</text>
<rect class="k-ok" x="775.5" y="336.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="844.5" y="354.0" text-anchor="middle">ran</text>
<text class="row-label" x="165.0" y="394.0" font-weight="600">Scores are right, but train re-runs every time -&gt; reward 0</text>
<text class="note" x="20" y="425.0">A freshly returned DataFrame gets a new artifact ID and pandas has no content hash, so disabling cache on load_data silently busts train&#x27;s cache.</text>
<rect class="k-ok" x="20.0" y="451.0" width="13" height="13" rx="3"/>
<text class="legend" x="39.0" y="462.0">ran</text>
<rect class="k-cached" x="78.66499999999999" y="451.0" width="13" height="13" rx="3"/>
