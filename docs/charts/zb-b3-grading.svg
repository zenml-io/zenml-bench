<rect class="bg" x="0.5" y="0.5" width="939" height="476" rx="10"/>
<text class="title" x="20" y="28">B3 (nightly): how the grader checks content-aware caching</text>
<text class="subtitle" x="20" y="46">Pipeline: load_data(path) -&gt; train(df) -&gt; evaluate(model, df). The grader swaps fixtures a, a, b, b, c at the same path.</text>
<text class="axis mono" x="240.5" y="76.0" text-anchor="middle">run 1</text>
<text class="axis mono" x="391.5" y="76.0" text-anchor="middle">run 2</text>
<text class="axis mono" x="542.5" y="76.0" text-anchor="middle">run 3</text>
<text class="axis mono" x="693.5" y="76.0" text-anchor="middle">run 4</text>
<text class="axis mono" x="844.5" y="76.0" text-anchor="middle">run 5</text>
<text class="section-head" x="20" y="104.0">A correct fix: cache key tracks the file&#x27;s contents (e.g. content hash or file_dependencies)</text>
<text class="row-label" x="153.0" y="134.0" text-anchor="end">data file</text>
<rect class="k-plain" x="171.5" y="116.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="240.5" y="134.0" text-anchor="middle">a</text>
<rect class="k-plain" x="322.5" y="116.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="391.5" y="134.0" text-anchor="middle">a</text>
<rect class="k-plain" x="473.5" y="116.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="542.5" y="134.0" text-anchor="middle">b</text>
<rect class="k-plain" x="624.5" y="116.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="693.5" y="134.0" text-anchor="middle">b</text>
<rect class="k-plain" x="775.5" y="116.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="844.5" y="134.0" text-anchor="middle">c</text>
<text class="row-label" x="153.0" y="176.0" text-anchor="end">load_data</text>
<rect class="k-ok" x="171.5" y="158.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="240.5" y="176.0" text-anchor="middle">ran</text>
<rect class="k-cached" x="322.5" y="158.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="391.5" y="176.0" text-anchor="middle">cached</text>
<rect class="k-ok" x="473.5" y="158.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="542.5" y="176.0" text-anchor="middle">ran</text>
<rect class="k-cached" x="624.5" y="158.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="693.5" y="176.0" text-anchor="middle">cached</text>
<rect class="k-ok" x="775.5" y="158.0" width="138.0" height="28" rx="5"/>
<text class="cell-text" x="844.5" y="176.0" text-anchor="middle">ran</text>
