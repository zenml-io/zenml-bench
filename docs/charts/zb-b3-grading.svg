<text class="row-label" x="170.0" y="234.0" font-weight="600">Scores right on every run, train cached exactly when the data did not change: reward 1</text>
<text class="row-label" x="20" y="272.0" font-weight="600">The obvious fix: enable_cache=False on load_data</text>
<text class="row-label" x="158.0" y="302.0" text-anchor="end">load_data</text>
<rect class="k-ok" x="175.0" y="284.0" width="136.0" height="28" rx="5"/>
