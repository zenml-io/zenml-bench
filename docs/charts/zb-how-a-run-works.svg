<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 424" width="940" height="424" role="img" aria-label="How one ZenML Bench attempt runs">
<title>How one ZenML Bench attempt runs</title>
<style>
svg { --paper:#f3f5f2; --surface:#fbfcfa; --ink:#1b2422; --muted:#56635e; --rule:#d5ddd8; --accent:#17667a;
  --accent-soft:#dcebee; --ok:#a9cdb3; --fail:#c2412d; --warn:#d9a13a; --stale:#b7c0bc; --partial:#e08a6a;
  --commit:#2c4a52; --commit-ink:#f3f5f2; --fail-ink:#ffffff; --band:#e9efec; --warn-soft:#f6ebd4; --fail-soft:#f7e2de; }
@media (prefers-color-scheme: dark) {
  svg { --paper:#111816; --surface:#18201e; --ink:#e3ebe7; --muted:#9aaaa4; --rule:#2c3835; --accent:#6cc0d4;
    --accent-soft:#1c3339; --ok:#3f7a55; --fail:#e0634e; --warn:#d9a54a; --stale:#56625e; --partial:#e59a7c;
    --commit:#a9ccd4; --commit-ink:#111816; --fail-ink:#111816; --band:#1e2926; --warn-soft:#332b1c; --fail-soft:#351f1c; }
}
text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.bg { fill: var(--surface); stroke: var(--rule); }
.title { font-size: 15px; font-weight: 600; }
.subtitle { font-size: 12px; fill: var(--muted); }
.axis { font-size: 11px; fill: var(--muted); }
.row-label { font-size: 12px; }
.bar-label { font-size: 11.5px; }
.note { font-size: 11px; fill: var(--muted); }
.legend { font-size: 11.5px; fill: var(--muted); }
.gridline { stroke: var(--rule); stroke-width: 1; }
.dashed { stroke: var(--rule); stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
.band { fill: var(--band); stroke: none; }
.k-problem { fill: var(--fail); } .k-decoy { fill: var(--warn); } .k-partial { fill: var(--partial); }
.k-neutral { fill: var(--stale); } .k-ok { fill: var(--ok); } .k-fail { fill: var(--fail); }
.k-cached { fill: var(--stale); } .k-plain { fill: var(--paper); stroke: var(--rule); }
.k-commit { fill: var(--commit); } .k-accent { fill: var(--accent); } .k-accent-soft { fill: var(--accent-soft); stroke: var(--accent); }
.k-warn-soft { fill: var(--warn-soft); stroke: var(--warn); } .k-fail-soft { fill: var(--fail-soft); stroke: var(--fail); }
.ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.box { fill: var(--paper); stroke: var(--rule); }
.box-hot { fill: var(--paper); stroke: var(--fail); stroke-width: 2; }
.box-good { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.box-warn { fill: var(--paper); stroke: var(--warn); stroke-width: 2; }
.box-soft { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.box-name { font-size: 12.5px; font-weight: 600; fill: var(--accent); }
.box-name-hot { font-size: 12.5px; font-weight: 600; fill: var(--fail); }
.box-name-warn { font-size: 12.5px; font-weight: 600; fill: var(--warn); }
.box-text { font-size: 11.5px; fill: var(--muted); }
.arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
.arrow-accent { stroke: var(--accent); stroke-width: 1.75; fill: none; marker-end: url(#arrowhead-accent); }
.arrow-hot { stroke: var(--fail); stroke-width: 1.75; fill: none; marker-end: url(#arrowhead-hot); }
.commit-label { font-size: 10px; font-weight: 600; fill: var(--commit-ink); }
.cell-text { font-size: 11px; font-weight: 600; fill: var(--ink); }
.cell-text-inv { font-size: 11px; font-weight: 600; fill: var(--fail-ink); }
.pill { fill: var(--accent-soft); stroke: none; }
.pill-text { font-size: 10.5px; font-weight: 600; fill: var(--accent); }
.pill-hot { fill: var(--fail-soft); stroke: var(--fail); stroke-width: 1; }
.pill-hot-text { font-size: 10.5px; font-weight: 600; fill: var(--fail); }
.section-head { font-size: 12px; font-weight: 600; fill: var(--ink); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a9893"/></marker><marker id="arrowhead-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#17667a"/></marker><marker id="arrowhead-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2412d"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="939" height="423" rx="10"/>
<text class="title" x="20" y="28">How one ZenML Bench attempt runs</text>
<text class="subtitle" x="20" y="46">Because the SQLite store lives in the container, graders re-run code on hidden data and verify every step is genuine.</text>
<text class="section-head" x="20" y="80.0">1. Image build (once per task, offline)</text>
<rect class="box" x="20.0" y="88.0" width="281.3" height="70.0" rx="8"/>
<text class="box-name mono" x="30.0" y="108.0">base image</text>
<text class="box-text" x="30.0" y="125.0">Python 3.14, ZenML 0.96.4, agent CLIs,</text>
<text class="box-text" x="30.0" y="139.0">offline docs, ZenML MCP server</text>
<path class="arrow" d="M303.3 123.0 L326.3 123.0"/>
<rect class="box" x="329.3" y="88.0" width="281.3" height="70.0" rx="8"/>
<text class="box-name mono" x="339.3" y="108.0">task image</text>
<text class="box-text" x="339.3" y="125.0">copies one of 13 shared projects to /app</text>
<text class="box-text" x="339.3" y="139.0">and runs zenml init</text>
<path class="arrow" d="M612.7 123.0 L635.7 123.0"/>
<rect class="box" x="638.7" y="88.0" width="281.3" height="70.0" rx="8"/>
<text class="box-name mono" x="648.7" y="108.0">setup_store.sh</text>
<text class="box-text" x="648.7" y="125.0">optional: registers stacks, or runs the real</text>
<text class="box-text" x="648.7" y="139.0">pipeline to seed history</text>
<path class="arrow-accent" d="M470.0 161.0 L470.0 183.0"/>
<text class="axis" x="480.0" y="176.0">fresh container for every attempt</text>
<text class="section-head" x="20" y="202.0">2. One attempt inside the container</text>
<rect class="box" x="20.0" y="212.0" width="260.0" height="82.0" rx="8"/>
<text class="box-name mono" x="30.0" y="232.0">agent</text>
<text class="box-text" x="30.0" y="249.0">reads instruction.md, edits code &amp; runs</text>
<text class="box-text" x="30.0" y="263.0">pipelines; 25–40 min; model API only</text>
<rect class="box-good" x="328.0" y="212.0" width="340.0" height="82.0" rx="8"/>
<text class="box-name mono" x="338.0" y="232.0">hidden grader (offline)</text>
<text class="box-text" x="338.0" y="249.0">re-runs the agent&#x27;s entrypoint on unseen fixtures,</text>
<text class="box-text" x="338.0" y="263.0">verifies run genuineness &amp; reads ZenML store</text>
<rect class="box-good" x="716.0" y="212.0" width="204.0" height="82.0" rx="8"/>
<text class="box-name mono" x="726.0" y="232.0">reward</text>
<text class="box-text" x="726.0" y="249.0">1 (all checks pass) or 0 (any</text>
<text class="box-text" x="726.0" y="263.0">check or integrity rule fails)</text>
<path class="arrow" d="M282.0 253.0 L325.0 253.0"/>
<text class="axis" x="304.0" y="246.0" text-anchor="middle">done</text>
<path class="arrow-accent" d="M670.0 253.0 L713.0 253.0"/>
<rect class="box-soft" x="95.0" y="324.0" width="520.0" height="56.0" rx="8"/>
<text class="box-name mono" x="107.0" y="345.0">local ZenML SQLite store (inside container)</text>
<text class="box-text" x="107.0" y="364.0">runs, step statuses, cache keys, artifacts, model versions, compiled stack settings</text>
<path class="arrow" d="M189.0 296.0 L189.0 321.0"/>
<text class="axis" x="181.0" y="313.0" text-anchor="end">reads &amp; writes</text>
<path class="arrow-accent" d="M447.0 296.0 L447.0 321.0"/>
<path class="arrow-accent" d="M515.0 322.0 L515.0 297.0"/>
<text class="axis" x="523.0" y="313.0">re-runs &amp; audits (assert_genuine_run)</text>
<rect class="box-good" x="21.0" y="397.0" width="12" height="12" rx="3"/>
<text class="legend" x="39.0" y="408.0">hidden grader boundary</text>
<rect class="k-accent-soft" x="195.61999999999998" y="397.0" width="13" height="13" rx="3"/>
<text class="legend" x="214.61999999999998" y="408.0">shared store audited for tampering</text>
</svg>
