<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 204" width="920" height="204" role="img" aria-label="R1 and R2: the chain the grader walks before it trusts a model">
<title>R1 and R2: the chain the grader walks before it trusts a model</title>
<style>
svg { --paper:#f3f5f2; --surface:#fbfcfa; --ink:#1b2422; --muted:#56635e; --rule:#d5ddd8; --accent:#17667a;
  --accent-soft:#dcebee; --ok:#a9cdb3; --fail:#c2412d; --warn:#d9a13a; --stale:#b7c0bc; --partial:#e08a6a;
  --commit:#2c4a52; --commit-ink:#f3f5f2; --fail-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --paper:#111816; --surface:#18201e; --ink:#e3ebe7; --muted:#9aaaa4; --rule:#2c3835; --accent:#6cc0d4;
    --accent-soft:#1c3339; --ok:#3f7a55; --fail:#e0634e; --warn:#d9a54a; --stale:#56625e; --partial:#e59a7c;
    --commit:#a9ccd4; --commit-ink:#111816; --fail-ink:#111816; }
}
text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.bg { fill: var(--surface); stroke: var(--rule); }
.title { font-size: 15px; font-weight: 600; }
.axis { font-size: 11px; fill: var(--muted); }
.row-label { font-size: 12px; }
.bar-label { font-size: 11.5px; }
.note { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12px; fill: var(--muted); }
.gridline { stroke: var(--rule); stroke-width: 1; }
.k-problem { fill: var(--fail); } .k-decoy { fill: var(--warn); } .k-partial { fill: var(--partial); }
.k-neutral { fill: var(--stale); } .k-ok { fill: var(--ok); } .k-fail { fill: var(--fail); }
.k-cached { fill: var(--stale); } .k-plain { fill: var(--paper); stroke: var(--rule); } .k-commit { fill: var(--commit); } .k-accent { fill: var(--accent); }
.ring { fill: none; stroke: var(--accent); stroke-width: 3; }
.box { fill: var(--paper); stroke: var(--rule); }
.box-hot { fill: var(--paper); stroke: var(--fail); stroke-width: 2; }
.box-good { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.box-name { font-size: 12.5px; font-weight: 600; fill: var(--accent); }
.box-text { font-size: 11.5px; fill: var(--muted); }
.arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
.commit-label { font-size: 10px; font-weight: 600; fill: var(--commit-ink); }
.cell-text { font-size: 11px; font-weight: 600; fill: var(--ink); }
.cell-text-inv { font-size: 11px; font-weight: 600; fill: var(--fail-ink); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a9893"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="203" rx="10"/>
<text class="title" x="20" y="28">R1 and R2: the chain the grader walks before it trusts a model</text>
<rect class="box" x="20.0" y="50.0" width="152.0" height="102" rx="8"/>
<text class="box-name mono" x="30.0" y="70.0">production version</text>
<text class="box-text" x="30.0" y="88.0">of research_model</text>
<path class="arrow" d="M174.0 101.0 C187.0 101.0 187.0 101.0 199.0 101.0"/>
<rect class="box" x="202.0" y="50.0" width="152.0" height="102" rx="8"/>
<text class="box-name mono" x="212.0" y="70.0">linked run</text>
<text class="box-text" x="212.0" y="88.0">of the research</text>
<text class="box-text" x="212.0" y="102.0">pipeline, status</text>
<text class="box-text" x="212.0" y="116.0">completed</text>
<path class="arrow" d="M356.0 101.0 C369.0 101.0 369.0 101.0 381.0 101.0"/>
<rect class="box" x="384.0" y="50.0" width="152.0" height="102" rx="8"/>
<text class="box-name mono" x="394.0" y="70.0">train step</text>
<text class="box-text" x="394.0" y="88.0">of that run; also</text>
<text class="box-text" x="394.0" y="102.0">recorded n_train_rows</text>
<text class="box-text" x="394.0" y="116.0">and a digest of the</text>
<text class="box-text" x="394.0" y="130.0">rows</text>
<path class="arrow" d="M538.0 101.0 C551.0 101.0 551.0 101.0 563.0 101.0"/>
<rect class="box" x="566.0" y="50.0" width="152.0" height="102" rx="8"/>
<text class="box-name mono" x="576.0" y="70.0">model output</text>
<text class="box-text" x="576.0" y="88.0">produced by that same</text>
<text class="box-text" x="576.0" y="102.0">step, not attached</text>
<text class="box-text" x="576.0" y="116.0">later</text>
<path class="arrow" d="M720.0 101.0 C733.0 101.0 733.0 101.0 745.0 101.0"/>
<rect class="box-good" x="748.0" y="50.0" width="152.0" height="102" rx="8"/>
<text class="box-name mono" x="758.0" y="70.0">hidden data</text>
<text class="box-text" x="758.0" y="88.0">the grader&#x27;s own</text>
<text class="box-text" x="758.0" y="102.0">evaluator scores it:</text>
<text class="box-text" x="758.0" y="116.0">gap_closed</text>
<text class="note" x="20" y="178.0">ZenML lets you attach any artifact to any model version, so a link alone proves nothing. A model that breaks the chain is not scored.</text>
</svg>
