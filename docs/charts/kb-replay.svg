<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-label="helpdesk worlds: how Kitaru&#x27;s tool policy protects real side effects during replay">
<title>helpdesk worlds: how Kitaru&#x27;s tool policy protects real side effects during replay</title>
<style>
svg { --paper:#f3f5f2; --surface:#fbfcfa; --ink:#1b2422; --muted:#56635e; --rule:#d5ddd8; --accent:#17667a;
  --accent-soft:#dcebee; --ok:#a9cdb3; --fail:#c2412d; --warn:#d9a13a; --stale:#b7c0bc; --partial:#e08a6a;
  --commit:#2c4a52; --commit-ink:#f3f5f2; --fail-ink:#ffffff; --band:#e9efec; --warn-soft:#f6ebd4; --fail-soft:#f7e2de; }
@media (prefers-color-scheme: dark) {
  svg { --paper:#111816; --surface:#18201e; --ink:#e3ebe7; --muted:#9aaaa4; --rule:#2c3835; --accent:#6cc0d4;
    --accent-soft:#1c3339; --ok:#3f7a55; --fail:#e0634e; --warn:#d9a54a; --stale:#56625e; --partial:#e59a7c;
    --commit:#a9ccd4; --commit-ink:#111816; --fail-ink:#111816; --band:#1e2926; --warn-soft:#332b1c; --fail-soft:#351f1c; }
}
text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.bg { fill: var(--surface); stroke: var(--rule); }
.title { font-size: 15px; font-weight: 600; }
.subtitle { font-size: 12px; fill: var(--muted); }
.axis { font-size: 11px; fill: var(--muted); }
.row-label { font-size: 12px; }
.bar-label { font-size: 11.5px; }
.note { font-size: 11px; fill: var(--muted); }
.legend { font-size: 11.5px; fill: var(--muted); }
.gridline { stroke: var(--rule); stroke-width: 1; }
.dashed { stroke: var(--rule); stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
.band { fill: var(--band); stroke: none; }
.k-problem { fill: var(--fail); } .k-decoy { fill: var(--warn); } .k-partial { fill: var(--partial); }
.k-neutral { fill: var(--stale); } .k-ok { fill: var(--ok); } .k-fail { fill: var(--fail); }
.k-cached { fill: var(--stale); } .k-plain { fill: var(--paper); stroke: var(--rule); }
.k-commit { fill: var(--commit); } .k-accent { fill: var(--accent); } .k-accent-soft { fill: var(--accent-soft); stroke: var(--accent); }
.k-warn-soft { fill: var(--warn-soft); stroke: var(--warn); } .k-fail-soft { fill: var(--fail-soft); stroke: var(--fail); }
.ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.box { fill: var(--paper); stroke: var(--rule); }
.box-hot { fill: var(--paper); stroke: var(--fail); stroke-width: 2; }
.box-good { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.box-warn { fill: var(--paper); stroke: var(--warn); stroke-width: 2; }
.box-soft { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.box-name { font-size: 12.5px; font-weight: 600; fill: var(--accent); }
.box-name-hot { font-size: 12.5px; font-weight: 600; fill: var(--fail); }
.box-name-warn { font-size: 12.5px; font-weight: 600; fill: var(--warn); }
.box-text { font-size: 11.5px; fill: var(--muted); }
.arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
.arrow-accent { stroke: var(--accent); stroke-width: 1.75; fill: none; marker-end: url(#arrowhead-accent); }
.arrow-hot { stroke: var(--fail); stroke-width: 1.75; fill: none; marker-end: url(#arrowhead-hot); }
.commit-label { font-size: 10px; font-weight: 600; fill: var(--commit-ink); }
.cell-text { font-size: 11px; font-weight: 600; fill: var(--ink); }
.cell-text-inv { font-size: 11px; font-weight: 600; fill: var(--fail-ink); }
.pill { fill: var(--accent-soft); stroke: none; }
.pill-text { font-size: 10.5px; font-weight: 600; fill: var(--accent); }
.pill-hot { fill: var(--fail-soft); stroke: var(--fail); stroke-width: 1; }
.pill-hot-text { font-size: 10.5px; font-weight: 600; fill: var(--fail); }
.section-head { font-size: 12px; font-weight: 600; fill: var(--ink); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a9893"/></marker><marker id="arrowhead-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#17667a"/></marker><marker id="arrowhead-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2412d"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="939" height="305" rx="10"/>
<text class="title" x="20" y="28">helpdesk worlds: how Kitaru&#x27;s tool policy protects real side effects during replay</text>
<text class="subtitle" x="20" y="46">Every replay task checks the root-only finance ledger before and after. One new refund row scores 0.</text>
<rect class="box" x="20.0" y="123.0" width="204.0" height="72" rx="8"/>
<text class="box-name mono" x="30.0" y="143.0">recorded run</text>
<text class="box-text" x="30.0" y="160.0">every model and tool call</text>
<text class="box-text" x="30.0" y="174.0">captured by Kitaru&#x27;s adapter</text>
<path class="arrow" d="M226.0 159.0 C238.0 159.0 238.0 159.0 249.0 159.0"/>
<rect class="box" x="252.0" y="123.0" width="204.0" height="72" rx="8"/>
<text class="box-name mono" x="262.0" y="143.0">replay</text>
<text class="box-text" x="262.0" y="160.0">re-runs the agent against a</text>
<text class="box-text" x="262.0" y="174.0">new release or model setting</text>
<path class="arrow" d="M458.0 159.0 C470.0 159.0 470.0 159.0 481.0 159.0"/>
<rect class="box" x="484.0" y="123.0" width="204.0" height="72" rx="8"/>
<text class="box-name mono" x="494.0" y="143.0">tool policy</text>
<text class="box-text" x="494.0" y="160.0">configured per tool; default is</text>
<text class="box-text" x="494.0" y="174.0">live</text>
<path class="arrow-accent" d="M690.0 159.0 C702.0 159.0 702.0 111.0 713.0 111.0"/>
<path class="arrow-hot" d="M690.0 159.0 C702.0 159.0 702.0 207.0 713.0 207.0"/>
<rect class="box-good" x="716.0" y="68.0" width="204.0" height="86" rx="8"/>
<text class="box-name mono" x="726.0" y="88.0">recorded</text>
<text class="box-text" x="726.0" y="105.0">answers from the recording;</text>
<text class="box-text" x="726.0" y="119.0">nothing reaches external</text>
<text class="box-text" x="726.0" y="133.0">services</text>
<rect class="box-hot" x="716.0" y="164.0" width="204.0" height="86" rx="8"/>
<text class="box-name-hot mono" x="726.0" y="184.0">live (default!)</text>
<text class="box-text" x="726.0" y="201.0">calls the real tool -&gt;</text>
<text class="box-text" x="726.0" y="215.0">issue_refund hits finance</text>
<text class="box-text" x="726.0" y="229.0">service -&gt; customer paid twice</text>
<rect class="box-good" x="21.0" y="280.0" width="12" height="12" rx="3"/>
<text class="legend" x="39.0" y="291.0">safe during replay</text>
<rect class="box-hot" x="167.87" y="280.0" width="12" height="12" rx="3"/>
<text class="legend" x="185.87" y="291.0">triggers real payment (reward 0)</text>
</svg>
