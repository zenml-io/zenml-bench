<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 288" width="920" height="288" role="img" aria-label="helpdesk worlds: what a replay does with each tool call">
<title>helpdesk worlds: what a replay does with each tool call</title>
<style>
svg { --paper:#f3f5f2; --surface:#fbfcfa; --ink:#1b2422; --muted:#56635e; --rule:#d5ddd8; --accent:#17667a;
  --accent-soft:#dcebee; --ok:#a9cdb3; --fail:#c2412d; --warn:#d9a13a; --stale:#b7c0bc; --partial:#e08a6a;
  --commit:#2c4a52; --commit-ink:#f3f5f2; --fail-ink:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --paper:#111816; --surface:#18201e; --ink:#e3ebe7; --muted:#9aaaa4; --rule:#2c3835; --accent:#6cc0d4;
    --accent-soft:#1c3339; --ok:#3f7a55; --fail:#e0634e; --warn:#d9a54a; --stale:#56625e; --partial:#e59a7c;
    --commit:#a9ccd4; --commit-ink:#111816; --fail-ink:#111816; }
}
text { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.bg { fill: var(--surface); stroke: var(--rule); }
.title { font-size: 15px; font-weight: 600; }
.axis { font-size: 11px; fill: var(--muted); }
.row-label { font-size: 12px; }
.bar-label { font-size: 11.5px; }
.note { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12px; fill: var(--muted); }
.gridline { stroke: var(--rule); stroke-width: 1; }
.k-problem { fill: var(--fail); } .k-decoy { fill: var(--warn); } .k-partial { fill: var(--partial); }
.k-neutral { fill: var(--stale); } .k-ok { fill: var(--ok); } .k-fail { fill: var(--fail); }
.k-cached { fill: var(--stale); } .k-plain { fill: var(--paper); stroke: var(--rule); } .k-commit { fill: var(--commit); } .k-accent { fill: var(--accent); }
.ring { fill: none; stroke: var(--accent); stroke-width: 3; }
.box { fill: var(--paper); stroke: var(--rule); }
.box-hot { fill: var(--paper); stroke: var(--fail); stroke-width: 2; }
.box-good { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.box-name { font-size: 12.5px; font-weight: 600; fill: var(--accent); }
.box-text { font-size: 11.5px; fill: var(--muted); }
.arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
.commit-label { font-size: 10px; font-weight: 600; fill: var(--commit-ink); }
.cell-text { font-size: 11px; font-weight: 600; fill: var(--ink); }
.cell-text-inv { font-size: 11px; font-weight: 600; fill: var(--fail-ink); }
</style>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a9893"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="287" rx="10"/>
<text class="title" x="20" y="28">helpdesk worlds: what a replay does with each tool call</text>
<rect class="box" x="20.0" y="106.0" width="197.5" height="74" rx="8"/>
<text class="box-name mono" x="30.0" y="126.0">recorded conversation</text>
<text class="box-text" x="30.0" y="144.0">every model and tool call,</text>
<text class="box-text" x="30.0" y="158.0">recorded by Kitaru&#x27;s adapter</text>
<path class="arrow" d="M219.5 143.0 C232.5 143.0 232.5 143.0 244.5 143.0"/>
<rect class="box" x="247.5" y="106.0" width="197.5" height="74" rx="8"/>
<text class="box-name mono" x="257.5" y="126.0">replay</text>
<text class="box-text" x="257.5" y="144.0">re-runs the agent (a newer</text>
<text class="box-text" x="257.5" y="158.0">release, a different setting)</text>
<path class="arrow" d="M447.0 143.0 C460.0 143.0 460.0 143.0 472.0 143.0"/>
<rect class="box" x="475.0" y="106.0" width="197.5" height="74" rx="8"/>
<text class="box-name mono" x="485.0" y="126.0">tool policy</text>
<text class="box-text" x="485.0" y="144.0">decided per tool; the default is</text>
<text class="box-text" x="485.0" y="158.0">live</text>
<path class="arrow" d="M674.5 143.0 C687.5 143.0 687.5 143.0 699.5 143.0"/>
<rect class="box-good" x="702.5" y="50.0" width="197.5" height="74" rx="8"/>
<text class="box-name mono" x="712.5" y="70.0">recorded</text>
<text class="box-text" x="712.5" y="88.0">answer from the recording;</text>
<text class="box-text" x="712.5" y="102.0">nothing leaves the box</text>
<rect class="box-hot" x="702.5" y="134.0" width="197.5" height="102" rx="8"/>
<text class="box-name mono" x="712.5" y="154.0">live</text>
<text class="box-text" x="712.5" y="172.0">real call: issue_refund reaches</text>
<text class="box-text" x="712.5" y="186.0">the finance service, which</text>
<text class="box-text" x="712.5" y="200.0">appends a row; a customer is</text>
<text class="box-text" x="712.5" y="214.0">paid again</text>
<text class="note" x="20" y="262.0">Every replay task counts the finance service&#x27;s rows before and after. One new row scores 0.</text>
</svg>
