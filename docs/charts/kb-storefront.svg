<text class="bar-label" x="218.0" y="97.0">1.3.0</text>
<rect class="k-neutral" x="567.0" y="102.0" width="243.0" height="14" rx="3"/>
<text class="bar-label" x="568.0" y="97.0">1.4.0</text>
<rect class="k-neutral" x="812.0" y="102.0" width="103.0" height="14" rx="3"/>
<text class="bar-label" x="813.0" y="97.0">1.4.1</text>
