<rect class="k-problem" x="707.0" y="378.0" width="68.0" height="14" rx="3"/>
<text class="note" x="20" y="418.0">Standing faults (repeated lookups, late/double refunds, curt replies, idle timeouts) occur throughout all 60 days; see table below.</text>
