<rect class="k-decoy" x="208.88" y="478.0" width="14" height="14" rx="3"/>
<text class="legend" x="228.88" y="490.0">a decoy: looks guilty, isn&#x27;t</text>
<rect class="k-partial" x="404.6" y="478.0" width="14" height="14" rx="3"/>
<text class="legend" x="424.6" y="490.0">a partial fix</text>
<rect class="k-neutral" x="518.24" y="478.0" width="14" height="14" rx="3"/>
<text class="legend" x="538.24" y="490.0">background or symptom</text>
<rect class="k-commit" x="691.28" y="478.0" width="14" height="14" rx="3"/>
<text class="legend" x="711.28" y="490.0">git commit</text>
</svg>
