<text class="note" x="20" y="464.0">Commits: 1 release 1.2.0 (shorter greeting); 2 prompt wording for the litter offer; 3 config: max_tokens 400 -&gt; 120, no release; 4 release 1.3.0.</text>
<rect class="k-problem" x="20.0" y="478.0" width="14" height="14" rx="3"/>
