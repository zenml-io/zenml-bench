schema_version = "1.4"

[task]
name = "zenml/b3-stale-cache"
version = "0.1.0"
description = "A ZenML pipeline serves stale cached results after its input file is replaced at the same path. Fix caching without disabling it for the expensive step."

[metadata]
family = "build-and-fix"
tier = "A"
difficulty_estimate = "easy"  # saturated: 12/12 for claude-opus-5 and gpt-5.6-terra on 2026-09-09
zenml_version = "0.96.4"
source = "design brief appendix A; classic support question (path-string parameter defeats caching)"
conditions_supported = ["bare", "skill", "mcp"]

[verifier]
timeout_sec = 900.0

[environment]
# Sealed by default (brief §5.8). Needs a Docker runtime with nftables egress control: OrbStack on macOS, Linux elsewhere.
network_mode = "no-network"

# During the agent's turn only, let it reach its model API. Add hosts here as harnesses are added.
[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]
