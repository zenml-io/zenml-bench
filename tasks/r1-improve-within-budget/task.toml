schema_version = "1.4"

[task]
name = "zenml/r1-improve-within-budget"
version = "0.1.0"
description = "Research loop: lower a model's validation log loss within a budget of 12 pipeline runs and promote the best model version to production; graded by re-evaluating the promoted model on hidden data."

[metadata]
family = "research"
tier = "A"
difficulty_estimate = "easy"  # pass/fail saturated 6/6 at the frontier tier on 2026-09-09; hidden_log_loss separates harnesses
zenml_version = "0.96.4"
source = "design brief R1 (autoresearch-style loop; Prime Intellect 'Measuring Autonomous AI Research' promotion-evidence finding)"
conditions_supported = ["bare", "skill", "mcp"]

[agent]
timeout_sec = 2400.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]

[verifier]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
