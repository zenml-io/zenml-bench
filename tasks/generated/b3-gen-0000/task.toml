schema_version = "1.4"

[task]
name = "zenml/b3-gen-0000"
version = "0.1.0"
description = "Generated B3 instance: the train_nightly pipeline serves stale cached results after data/training_set.csv is replaced; fix caching without disabling it for the expensive `train` step."

[metadata]
family = "build-and-fix"
tier = "A"
difficulty_estimate = "easy"
zenml_version = "0.96.4"
source = "generated by scripts/generate_instances.py from b3-stale-cache"
generated_from = "b3-stale-cache"
generator_family = "b3"
generator_seed = 0
generator_params = '{"pipeline": "train_nightly", "loader": "load_rows", "trainer": "train", "evaluator": "assess", "score": "val_accuracy", "data": "data/training_set.csv", "path_is_param": false, "expensive": "trainer"}'  # JSON string
conditions_supported = ["bare", "skill", "mcp"]

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]

[verifier]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
