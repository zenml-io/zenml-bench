schema_version = "1.4"

[task]
name = "zenml/b10-gen-0004"
version = "0.1.0"
description = "Generated B10 instance (fault: amounts of 1000 or more written with a thousands separator, e.g. \"1,234.50\"). The most recent scheduled region_digest run failed; find the day and the cause in the ZenML store, fix it, produce the report."

[metadata]
family = "build-and-fix"
tier = "A"
difficulty_estimate = "easy"
zenml_version = "0.96.4"
source = "generated by scripts/generate_instances.py from b10-why-did-it-fail"
generated_from = "b10-why-did-it-fail"
generator_family = "b10"
generator_seed = 4
generator_params = '{"fault": "sep", "target": "2026-05-18", "pipeline": "region_digest", "naming": ["scheduled", "scheduled", "manual", "manual"], "regions": ["north", "south", "east", "west"], "distractors": {"missing_file": false, "missing_dir": true}}'  # JSON string
conditions_supported = ["bare", "skill", "mcp"]

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]

[verifier]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
