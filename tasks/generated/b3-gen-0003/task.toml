schema_version = "1.4"

[task]
name = "zenml/b3-gen-0003"
version = "0.1.0"
description = "Generated B3 instance: the model_refresh pipeline serves stale cached results after data/train.csv is replaced; fix caching without disabling it for the expensive `fit` step."

[metadata]
family = "build-and-fix"
tier = "A"
difficulty_estimate = "easy"
zenml_version = "0.96.4"
source = "generated by scripts/generate_instances.py from b3-stale-cache"
generated_from = "b3-stale-cache"
generator_family = "b3"
generator_seed = 3
generator_params = {"pipeline": "model_refresh", "loader": "read_dataset", "trainer": "fit", "evaluator": "validate_model", "score": "score", "data": "data/train.csv", "path_is_param": true, "expensive": "trainer"}
conditions_supported = ["bare", "skill", "mcp"]

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]

[verifier]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
