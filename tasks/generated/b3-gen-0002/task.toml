schema_version = "1.4"

[task]
name = "zenml/b3-gen-0002"
version = "0.1.0"
description = "Generated B3 instance: the nightly_training pipeline serves stale cached results after data/latest.csv is replaced; fix caching without disabling it for the expensive `assess` step."

[metadata]
family = "build-and-fix"
tier = "A"
difficulty_estimate = "easy"
zenml_version = "0.96.4"
source = "generated by scripts/generate_instances.py from b3-stale-cache"
generated_from = "b3-stale-cache"
generator_family = "b3"
generator_seed = 2
generator_params = {"pipeline": "nightly_training", "loader": "load_data", "trainer": "train", "evaluator": "assess", "score": "accuracy", "data": "data/latest.csv", "path_is_param": false, "expensive": "evaluator"}
conditions_supported = ["bare", "skill", "mcp"]

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]

[verifier]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
