schema_version = "1.4"

[task]
name = "zenml/b10-gen-0001"
version = "0.1.0"
description = "Generated B10 instance (fault: refunds written as amounts in parentheses, e.g. "(123.45)"). The most recent scheduled sales_summary run failed; find the day and the cause in the ZenML store, fix it, produce the report."

[metadata]
family = "build-and-fix"
tier = "A"
difficulty_estimate = "easy"
zenml_version = "0.96.4"
source = "generated by scripts/generate_instances.py from b10-why-did-it-fail"
generated_from = "b10-why-did-it-fail"
generator_family = "b10"
generator_seed = 1
generator_params = {"fault": "paren_neg", "target": "2026-04-27", "pipeline": "sales_summary", "naming": ["job", "scheduled", "run", "manual"], "regions": ["central", "coastal", "islands", "highlands"], "distractors": {"missing_file": true, "missing_dir": true}}
conditions_supported = ["bare", "skill", "mcp"]

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]

[verifier]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
