schema_version = "1.4"

[task]
name = "zenml/b10-gen-0002"
version = "0.1.0"
description = "Generated B10 instance (fault: timestamps written with slashes, e.g. "2026/09/09 13:17:08"). The most recent scheduled daily_digest run failed; find the day and the cause in the ZenML store, fix it, produce the report."

[metadata]
family = "build-and-fix"
tier = "A"
difficulty_estimate = "easy"
zenml_version = "0.96.4"
source = "generated by scripts/generate_instances.py from b10-why-did-it-fail"
generated_from = "b10-why-did-it-fail"
generator_family = "b10"
generator_seed = 2
generator_params = {"fault": "date_fmt", "target": "2026-02-11", "pipeline": "daily_digest", "naming": ["cron", "cron", "adhoc", "adhoc"], "regions": ["uk", "de", "fr", "nl"], "distractors": {"missing_file": true, "missing_dir": true}}
conditions_supported = ["bare", "skill", "mcp"]

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]

[verifier]
timeout_sec = 900.0

[environment]
network_mode = "no-network"
