schema_version = "1.4"

[task]
name = "zenml/kitaru-c6-check-before-merge"
version = "0.1.0"
description = "Write a script that runs the team's release checks on a Kitaru cohort and exits non-zero when too few conversations pass; it is run on cohorts the agent never saw."

[metadata]
family = "checks"
world = "storefront"
difficulty_estimate = "unknown"  # set after the first baseline
kitaru_version = "0.27.7"
source = "docs/2026-11-20-kitaru-plan.md, task C6"
conditions_supported = ["bare"]

[verifier]
timeout_sec = 1800.0

[environment]
# Starts as an allowlist, not "no-network": on Modal a sandbox created with no domain list cannot be given one later (decisions.md 2026-11-20).
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]
cpus = 2
memory_mb = 4096
# Until the base image is on a registry, Modal builds everything from the Dockerfile the first time: over 10 minutes. Later runs reuse it.
build_timeout_sec = 1800.0

# Nothing in the image starts by itself. Harbor runs this as root before the agent, until it exits 0.
[environment.healthcheck]
command = "/opt/kitaru-bench/start.sh"
interval_sec = 3.0
start_interval_sec = 3.0
start_period_sec = 180.0
timeout_sec = 60.0
retries = 3

[agent]
user = "agent"  # not root: the agent reaches Kitaru over HTTP and cannot open the database
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]
