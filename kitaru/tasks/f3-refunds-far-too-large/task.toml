schema_version = "1.4"

[task]
name = "zenml/kitaru-f3-refunds-far-too-large"
version = "0.1.0"
description = "Symptom only: some refunds are far too large. Find the currency fault and fix it in a new release without paying anyone; hidden conversations in every currency are replayed against the fix, and the obvious fix breaks yen."

[metadata]
family = "replay"
world = "helpdesk-live"
difficulty_estimate = "easy"  # 2026-11-21 bare, k=5: sonnet-5.5, gpt-5.6-terra, gpt-5.4-mini = 5/5, 5/5, 3/5
kitaru_version = "0.27.7"
source = "docs/2026-11-20-kitaru-plan.md, task F3"
conditions_supported = ["bare"]

[verifier]
timeout_sec = 1500.0

[environment]
# Starts as an allowlist, not "no-network": on Modal a sandbox created with no domain list cannot be given one later (decisions.md 2026-11-20).
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]
cpus = 2
memory_mb = 4096
build_timeout_sec = 1800.0

# Nothing in the image starts by itself. Harbor runs this as root before the agent, until it exits 0.
[environment.healthcheck]
command = "/opt/kitaru-bench/start.sh"
interval_sec = 3.0
start_interval_sec = 3.0
start_period_sec = 180.0
timeout_sec = 60.0
retries = 3

[agent]
user = "agent"  # not root: the agent reaches Kitaru over HTTP and cannot open the database
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "chatgpt.com"]
